name: Release

# Attach airtouch-panel.js to every tagged release so HACS can pull it
# straight from the release assets.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload card to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG:-$(git describe --tags --abbrev=0)}"
          gh release upload "$TAG" airtouch-panel.js --clobber
